<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AIシバサキに質問（検証）| 01START</title>
<link rel="preconnect" href="https://esm.sh" crossorigin>
<link rel="preconnect" href="https://keisuke.app.n8n.cloud" crossorigin>
<link rel="preconnect" href="https://js.hsforms.net" crossorigin>
<script charset="utf-8" type="text/javascript" src="//js.hsforms.net/forms/embed/v2.js"></script>
<style>
  :root{--navy:#1A237E;--orange:#F66901;--bg:#f5f6fa;--line:#e2e5ee}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:var(--bg);color:#1f2433;line-height:1.7}
  .wrap{max-width:880px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:22px;color:var(--navy);margin:8px 0 4px}
  .sub{color:#5a6072;font-size:14px;margin:0 0 20px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 2px 14px rgba(26,35,126,.06)}
  #hsform{min-height:60px}
  .hs-form .hs-button{background:var(--orange)!important;border:none!important;border-radius:10px!important;padding:13px 20px!important;font-weight:700!important;cursor:pointer;width:100%}
  .hs-form label{font-size:13px;font-weight:600;color:#39405a}
  .hs-form input.hs-input{width:100%!important;padding:11px 13px!important;border:1px solid var(--line)!important;border-radius:9px!important;font-size:15px!important}
  /* 2カラム: 左=AIシバサキ(写真→ライブ映像) / 右=フォーム→対話 */
  .lead-layout{display:grid;grid-template-columns:minmax(240px,330px) 1fr;gap:20px;align-items:start}
  @media(max-width:640px){.lead-layout{grid-template-columns:1fr;gap:16px}}
  .photo-frame{position:relative;width:100%;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#0b1020}
  .photo-frame img,.photo-frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 12%}
  .photo-frame::after{content:"";position:absolute;inset:0;border-radius:12px;animation:ring 2.6s ease-out infinite;pointer-events:none}
  @keyframes ring{0%{box-shadow:inset 0 0 0 3px rgba(246,105,1,.55)}70%{box-shadow:inset 0 0 0 3px rgba(246,105,1,0)}100%{box-shadow:inset 0 0 0 3px rgba(246,105,1,0)}}
  .online-badge{position:absolute;top:10px;left:10px;z-index:3;display:flex;align-items:center;gap:6px;background:rgba(11,16,32,.74);color:#fff;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px}
  .online-dot{width:9px;height:9px;border-radius:50%;background:#2ecc71;animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,204,113,.6)}70%{box-shadow:0 0 0 7px rgba(46,204,113,0)}100%{box-shadow:0 0 0 0 rgba(46,204,113,0)}}
  #status{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;color:#fff;font-size:13px;background:rgba(11,16,32,.82)}
  #status[hidden]{display:none!important}
  .spin{width:32px;height:32px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .photo-caption{margin-top:12px;font-size:13px;color:#5a6072;text-align:center;line-height:1.75}
  .photo-caption strong{color:var(--navy)}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .controls input{flex:1;min-width:150px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:14px}
  .btn{appearance:none;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px}
  .btn-sub{background:var(--navy);color:#fff;padding:11px 14px}
  .btn-ghost{background:#eef0f7;color:var(--navy);padding:11px 14px}
  .btn-end{background:#c0392b;color:#fff;padding:11px 16px}
  #transcript{margin-top:14px;max-height:300px;overflow:auto;font-size:14px}
  .msg{margin:7px 0;padding:9px 12px;border-radius:10px;max-width:90%;white-space:pre-wrap;word-break:break-word}
  .msg.user{background:#e9edff;margin-left:auto;color:#23306e}
  .msg.avatar{background:#fff3e8;border:1px solid #ffd9bd;color:#7a3b07}
  .convo-title{font-size:13px;font-weight:700;color:var(--navy);margin:0 0 10px}
  #done{text-align:center;padding:40px 16px}
  #done h2{color:var(--navy)}
  .note{font-size:12px;color:#8a90a2;margin-top:18px;text-align:center}
  .err{color:#c0392b;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>AIシバサキに質問</h1>
  <p class="sub">株式会社01START 代表「AIシバサキ」が、会社・サービスについてその場でお答えします（検証版）。<br>フォームを送信すると、左の画面でAIシバサキとの対話が始まります。</p>

  <!-- 2カラム: 左=AIシバサキ / 右=フォーム→対話 -->
  <div class="lead-layout" id="leadLayout">
    <!-- 左: AIシバサキ（写真→ライブ映像） -->
    <div class="card" id="leftCard">
      <div class="photo-frame">
        <img id="posterImg" src="/images/shibasaki-waiting.jpg?v=20260524" alt="AIシバサキ（芝先 恵介）がオンラインで待機中">
        <video id="avatarVideo" autoplay playsinline hidden></video>
        <span class="online-badge"><span class="online-dot"></span>オンライン</span>
        <div id="status" hidden><div class="spin"></div><div id="statusText">接続中…</div></div>
      </div>
      <p class="photo-caption" id="leftCaption"><strong>AIシバサキ</strong>が画面の向こうでお待ちしています。<br>右のフォーム送信で対話が始まります。</p>
    </div>

    <!-- 右: フォーム → 対話パネル -->
    <div class="card" id="rightCard">
      <div id="hsform"></div>
      <div class="err" id="formErr" hidden></div>
      <div id="convo" hidden>
        <p class="convo-title">AIシバサキと対話中</p>
        <div class="controls">
          <button class="btn btn-ghost" id="micBtn" type="button">🎤 マイク: ON</button>
          <input id="textInput" type="text" placeholder="テキストでも質問できます">
          <button class="btn btn-sub" id="sendBtn" type="button">送信</button>
          <button class="btn btn-end" id="endBtn" type="button">終了</button>
        </div>
        <div id="transcript"></div>
      </div>
    </div>
  </div>

  <div id="done" hidden>
    <h2>ありがとうございました</h2>
    <p>お問い合わせ内容を承りました。必要に応じて担当よりご連絡いたします。</p>
  </div>

  <p class="note">※ マイクの使用を許可すると音声で会話できます。テキスト入力でも質問できます。</p>
</div>

<script type="module">
import { LiveAvatarSession, SessionEvent, AgentEventsEnum }
  from 'https://esm.sh/@heygen/liveavatar-web-sdk';

const TOKEN_URL   = 'https://keisuke.app.n8n.cloud/webhook/liveavatar-token';
const SESSION_URL = 'https://keisuke.app.n8n.cloud/webhook/liveavatar-session';
const $ = (id) => document.getElementById(id);
let session = null, transcript = [], startedAt = 0, lead = {}, posted = false, started = false, connected = false;

function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function pushMsg(role, text){
  const t = String(text||'').trim(); if(!t) return;
  // 直前の同一role・同一テキストはスキップ（テキスト送信のSDKエコー重複対策）
  const last = transcript[transcript.length-1];
  if (last && last.role===role && last.text===t) return;
  transcript.push({role, text:t}); renderTranscript();
}
function renderTranscript(){
  const box = $('transcript');
  box.innerHTML = transcript.map(m =>
    `<div class="msg ${m.role==='avatar'?'avatar':'user'}">${m.role==='avatar'?'AIシバサキ':'あなた'}: ${escapeHtml(m.text)}</div>`
  ).join('');
  box.scrollTop = box.scrollHeight;
}
function endHandler(){
  if (posted) return; posted = true;
  // 接続して会話が成立した場合のみ HubSpot 記録 + 完了画面を表示
  // (接続失敗・クレジット切れ等で会話が無い場合は記録せず、エラー表示のまま維持)
  if (!connected || transcript.length === 0) return;
  const payload = { company: lead.company, name: lead.name, email: lead.email,
    transcript, durationSec: Math.round((Date.now()-startedAt)/1000), pageUrl: location.href };
  fetch(SESSION_URL, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(payload), keepalive:true}).catch(()=>{});
  $('leadLayout').hidden = true; $('done').hidden = false;
}

async function startAvatar(){
  // 右: フォーム → 対話パネル
  $('hsform').style.display = 'none'; $('convo').hidden = false;
  // 左: 接続中オーバーレイ
  $('status').hidden = false; $('status').style.display = 'flex';
  const spinnerShownAt = Date.now();   // 「接続中…」を最低 MIN_SPINNER_MS 表示する基準
  const MIN_SPINNER_MS = 1200;
  $('leftCaption').innerHTML = '<strong>AIシバサキ</strong>とお話しください。';
  try {
    const r = await fetch(TOKEN_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(lead)});
    const data = await r.json();
    if (!data.session_token) throw new Error('token取得に失敗しました');
    session = new LiveAvatarSession(data.session_token);
    const vid = $('avatarVideo');
    // 左: 写真→ライブ映像に切替＋スピナー解除（接続成立の確定処理）
    function markConnected(){
      connected = true;
      $('posterImg').hidden = true; vid.hidden = false;
      // 接続が速すぎてもスピナーを最低 MIN_SPINNER_MS は見せる（接続中フィードバック確保）
      const hideSpinner = () => { $('status').hidden = true; $('status').style.display = 'none'; };
      const elapsed = Date.now() - spinnerShownAt;
      if (elapsed >= MIN_SPINNER_MS) hideSpinner();
      else setTimeout(hideSpinner, MIN_SPINNER_MS - elapsed);
    }
    function tryAttach(){ try { session.attach(vid); } catch(_){} }
    // 映像が実際に再生され始めたら確実にスピナーを消す（SDKイベント名/タイミングに依存しない）
    vid.addEventListener('loadeddata', markConnected);
    vid.addEventListener('playing', markConnected);
    session.on(SessionEvent.SESSION_STREAM_READY, () => { tryAttach(); markConnected(); });
    session.on(SessionEvent.SESSION_DISCONNECTED, endHandler);
    session.on(AgentEventsEnum.SESSION_STOPPED, endHandler);
    session.on(AgentEventsEnum.USER_TRANSCRIPTION,   p => { if(p&&p.text){ pushMsg('user',   p.text); }});
    session.on(AgentEventsEnum.AVATAR_TRANSCRIPTION, p => { if(p&&p.text){ pushMsg('avatar', p.text); }});
    startedAt = Date.now();
    await session.start();
    tryAttach();
    // フォールバック: start後に映像ストリームが来ていればスピナー解除（最大3回チェック）
    let _chk = 0;
    const _iv = setInterval(() => {
      if ($('status').hidden) { clearInterval(_iv); return; }
      if (vid.srcObject || vid.readyState >= 2) { markConnected(); clearInterval(_iv); }
      if (++_chk >= 6) clearInterval(_iv);
    }, 1000);
    try { await session.voiceChat.start({ defaultMuted:false }); $('micBtn').textContent='🎤 マイク: ON'; }
    catch(err){ console.warn('voiceChat', err); $('micBtn').textContent='🎤 マイク: 不可'; }
  } catch (err) {
    $('status').hidden = true; $('status').style.display='none'; $('convo').hidden = true; $('hsform').style.display='';
    const el=$('formErr'); el.hidden=false; el.textContent='接続エラー: '+(err.message||err)+'  時間をおいて再度お試しください。';
  }
}

$('micBtn').addEventListener('click', async () => {
  if (!session || !session.voiceChat) return;
  try {
    if (session.voiceChat.isMuted) { await session.voiceChat.unmute(); $('micBtn').textContent='🎤 マイク: ON'; }
    else { await session.voiceChat.mute(); $('micBtn').textContent='🔇 マイク: OFF'; }
  } catch(_){}
});
$('sendBtn').addEventListener('click', () => {
  const t = $('textInput').value.trim();
  if (t && session) { try{ session.message(t); }catch(_){} pushMsg('user',t); $('textInput').value=''; }
});
$('textInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); $('sendBtn').click(); }});
$('endBtn').addEventListener('click', () => { if (session) { try{ session.stop(); }catch(_){} } endHandler(); });
window.addEventListener('beforeunload', () => { if (session && !posted) endHandler(); });

// --- HubSpotフォーム: postMessage で送信値を取得しアバター起動 ---
function startFromValues(map){
  if (started) return; started = true;
  lead = {
    company: (map.company || '').trim(),
    name: ((map.lastname || '') + ' ' + (map.firstname || '')).trim(),
    name_kana: ((map.lastname_furigana || '') + ' ' + (map.firstname_furigana || '')).trim(),
    email: (map.email || '').trim()
  };
  startAvatar();
}
window.addEventListener('message', function(e){
  try {
    if (e && e.data && e.data.type === 'hsFormCallback' && e.data.eventName === 'onFormSubmit') {
      const map = {};
      (e.data.data || []).forEach(function(f){ if (f && f.name != null) map[f.name] = f.value; });
      startFromValues(map);
    }
  } catch(_){}
});
function createHsForm(){
  if (!window.hbspt || !window.hbspt.forms) { setTimeout(createHsForm, 200); return; }
  window.hbspt.forms.create({ portalId: "8655538", formId: "763c4a27-4eb7-4d41-8e68-050826367e38", region: "na2", target: "#hsform" });
}
createHsForm();
</script>
</body>
</html>
