<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ご提案動画のご視聴 | 01START</title>
<meta name="robots" content="noindex,nofollow">
<!-- 🚨 no-referrer にはしない。Bunny の許可ドメイン判定は Referer を見るため。
     strict-origin-when-cross-origin なら ?t= は外に漏れず、オリジンだけが Bunny に届く。 -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://keisuke.app.n8n.cloud">
<link rel="preconnect" href="https://iframe.mediadelivery.net">
<style>
:root{
  --bg:#FBFAF7; --bg-2:#F3EFE8; --surface:#fff;
  --ink:#141821; --ink-2:#4A5262; --ink-3:#8A93A4;
  --line:#E6E1D7; --line-2:#D8D2C5;
  --accent:#E85A1A; --accent-2:#FF7438; --accent-ink:#fff;
  --dark:#0E1320; --err:#B3372B;
  --r-sm:6px; --r-md:10px; --r-lg:18px; --r-pill:999px;
  --sans:'Inter','Noto Sans JP',"Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --shadow:0 8px 24px -12px rgba(10,14,28,.18),0 0 0 1px rgba(10,14,28,.06);
}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.85;-webkit-font-smoothing:antialiased}
body,body *{word-break:keep-all;line-break:strict;text-wrap:pretty}
img,svg,iframe{display:block;max-width:100%}
[hidden]{display:none !important}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}

.wrap{max-width:820px;margin:0 auto;padding:0 20px}
.site-head{border-bottom:1px solid var(--line);background:var(--surface)}
.site-head .wrap{display:flex;align-items:center;gap:12px;height:58px}
.brand{font-weight:800;letter-spacing:.02em;font-size:15px}
.brand span{color:var(--accent)}
.head-sub{color:var(--ink-3);font-size:12.5px}

main{padding:40px 0 72px}
h1{font-size:clamp(21px,3.6vw,27px);line-height:1.5;margin:0 0 10px;text-wrap:balance}
h2{font-size:16px;margin:0 0 8px}
p{margin:0 0 12px}
.lede{color:var(--ink-2);font-size:14.5px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:28px 26px;box-shadow:var(--shadow);min-width:0}
.card.narrow{max-width:520px;margin:0 auto}

label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin:18px 0 6px}
input[type=email]{width:100%;padding:13px 14px;font:inherit;font-size:16px;
  border:1.5px solid var(--line-2);border-radius:var(--r-md);background:var(--bg);color:var(--ink)}
input[type=email]:focus{border-color:var(--accent);outline:none;background:var(--surface)}
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:12px 22px;border-radius:var(--r-pill);border:1.5px solid transparent;
  font-weight:700;font-size:15px;text-decoration:none;transition:.18s}
.btn-primary{background:var(--accent);color:var(--accent-ink);width:100%}
.btn-primary:hover:not(:disabled){background:var(--accent-2)}
.btn-primary:disabled{opacity:.55;cursor:progress}
.btn-ghost{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink)}
.err{color:var(--err);font-size:13.5px;margin-top:12px;font-weight:600}
.note{color:var(--ink-3);font-size:12.5px;margin-top:16px;line-height:1.75}

.greet{font-size:15px;color:var(--ink-2);margin-bottom:14px}
.greet b{color:var(--ink);font-size:17px}
.video-wrap{position:relative;aspect-ratio:16/9;background:var(--dark);
  border-radius:var(--r-md);overflow:hidden;margin-bottom:20px}
.video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.actions .btn{flex:1 1 220px}
#qa{margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
#qa h2{font-size:17px;margin-bottom:4px}
.qa-note{color:var(--ink-2);font-size:13.5px;margin-bottom:14px}
#aiFrame{width:100%;border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--surface);transition:height .25s ease}
footer{border-top:1px solid var(--line);padding:22px 0;color:var(--ink-3);font-size:12.5px}
@media (max-width:520px){
  main{padding:26px 0 48px}
  .card{padding:22px 18px}
  .actions .btn{flex:1 1 100%}
}
</style>
</head>
<body>

<header class="site-head">
  <div class="wrap">
    <div class="brand">01<span>START</span></div>
    <div class="head-sub">ご提案動画</div>
  </div>
</header>

<main class="wrap">
  <!-- 🚨 初期表示はメール入力だけ。動画 URL・資料リンク・お名前は DOM に一切書かない
       （ページのソースを見ても何も分からない状態にする） -->
  <section id="gate" class="card narrow">
    <h1>ご提案動画のご視聴</h1>
    <p class="lede">ご本人確認のため、資料をご請求いただいたメールアドレスをご入力ください。</p>
    <form id="gateForm" novalidate>
      <label for="email">メールアドレス</label>
      <input id="email" type="email" name="email" autocomplete="email"
             inputmode="email" placeholder="you@example.co.jp" required>
      <p id="gateErr" class="err" role="alert" hidden></p>
      <div style="margin-top:18px"><button id="gateBtn" type="submit" class="btn btn-primary">視聴する</button></div>
    </form>
    <p class="note">
      このページは、ご登録のメールアドレスの方のみご覧いただけます。<br>
      ご不明な点は <a href="mailto:support@01start.jp">support@01start.jp</a> までお気軽にご連絡ください。
    </p>
  </section>

  <section id="viewer" hidden></section>
</main>

<footer><div class="wrap">株式会社01START</div></footer>

<script>
(function () {
  'use strict';
  var API = 'https://keisuke.app.n8n.cloud/webhook/';
  var q = function (id) { return document.getElementById(id); };
  var token = new URLSearchParams(location.search).get('t') || '';
  var viewerToken = '';
  var watchSec = 0, sentSec = -1, playing = false;

  // ── 視聴ログ。text/plain にして preflight を起こさない（sendBeacon と同じ形） ──
  function track(type, extra) {
    if (!viewerToken) return;
    var body = JSON.stringify(Object.assign({ viewerToken: viewerToken, type: type }, extra || {}));
    try {
      if (type === 'progress' && navigator.sendBeacon) {
        navigator.sendBeacon(API + 'pv-event', new Blob([body], { type: 'text/plain' }));
        return;
      }
      fetch(API + 'pv-event', { method: 'POST', headers: { 'Content-Type': 'text/plain' },
        body: body, keepalive: true }).catch(function () {});
    } catch (e) {}
  }

  // ── 本人確認 ──
  q('gateForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var btn = q('gateBtn'), err = q('gateErr');
    err.hidden = true;
    btn.disabled = true; btn.textContent = '確認中…';
    fetch(API + 'pv-view', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ t: token, email: q('email').value })
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d || !d.ok) {
        err.textContent = (d && d.message) || 'ご確認できませんでした。時間をおいて再度お試しください。';
        err.hidden = false;
        btn.disabled = false; btn.textContent = '視聴する';
        return;
      }
      viewerToken = d.viewerToken;
      render(d);
    }).catch(function () {
      err.textContent = '通信に失敗しました。電波の良い場所で再度お試しください。';
      err.hidden = false;
      btn.disabled = false; btn.textContent = '視聴する';
    });
  });

  // ── 確認できた後にはじめて中身を作る ──
  function render(d) {
    var gate = q('gate');
    if (gate && gate.parentNode) gate.parentNode.removeChild(gate);
    var v = q('viewer');

    var greet = document.createElement('p');
    greet.className = 'greet';
    greet.appendChild(document.createTextNode((d.companyName || '') + '　'));
    var b = document.createElement('b');
    b.textContent = (d.contactName || '') + ' 様';
    greet.appendChild(b);
    greet.appendChild(document.createTextNode('　ご視聴ありがとうございます。'));

    var card = document.createElement('div');
    card.className = 'card';
    card.appendChild(greet);

    var vw = document.createElement('div');
    vw.className = 'video-wrap';
    var f = document.createElement('iframe');
    f.id = 'player';
    f.src = d.videoEmbedUrl;             // autoplay=false は API 側で付与済み
    f.title = 'ご提案動画';
    f.loading = 'eager';
    f.setAttribute('allow', 'accelerometer;autoplay;encrypted-media;gyroscope;picture-in-picture;fullscreen');
    f.setAttribute('allowfullscreen', '');
    vw.appendChild(f);
    card.appendChild(vw);

    var acts = document.createElement('div');
    acts.className = 'actions';
    if (d.slidesPdfUrl) acts.appendChild(mkBtn('📄 投影資料をダウンロード', 'btn-ghost', function () {
      track('pdf_click'); window.open(d.slidesPdfUrl, '_blank', 'noopener');
    }));
    if (d.bookingUrl) acts.appendChild(mkBtn('📅 30分の無料相談を予約する', 'btn-primary', function () {
      track('book_click'); window.open(d.bookingUrl, '_blank', 'noopener');
    }));
    card.appendChild(acts);

    // ── AIシバサキ質疑応答（qaEnabled のときだけ描画。無効なら痕跡も残さない） ──
    if (d.qaEnabled === true) {
      var qa = document.createElement('div');
      qa.id = 'qa';
      var qaH = document.createElement('h2');
      qaH.textContent = 'ご質問は AIシバサキへ';
      var qaP = document.createElement('p');
      qaP.className = 'qa-note';
      qaP.textContent = 'ご提案の内容について、その場で音声でお答えします（最長5分・無料）。';
      var qf = document.createElement('iframe');
      qf.id = 'aiFrame';
      qf.src = 'ai-shibasaki-test.html?mode=proposal&v=20260729a';   // widget 更新時は ?v= を bump
      qf.title = 'AIシバサキに質問';
      qf.setAttribute('allow', 'microphone; autoplay; fullscreen; clipboard-write');
      qf.style.height = '640px';
      qa.appendChild(qaH); qa.appendChild(qaP); qa.appendChild(qf);
      card.appendChild(qa);

      // widget との postMessage 契約。
      // 🚨 既存の startWatch のリスナは context!=='player.js' で捨てるため相乗りできない（別リスナ必須）。
      // 🚨 viewerToken は postMessage でのみ渡す（iframe の URL に載せると Referer/履歴に残る）。
      window.addEventListener('message', function (e) {
        if (e.origin !== location.origin) return;    // 同一オリジンの widget のみ
        var m = e.data || {};
        if (m.type === 'proposal-ready') {
          // ready を受けるたびに再送 = 冪等ハンドシェイク（load 契機だけでは module import 前で取りこぼす）
          try { qf.contentWindow.postMessage({ type: 'proposal-lead', viewerToken: viewerToken }, location.origin); } catch (err) {}
        } else if (m.type === 'ai-shibasaki-height' && m.height) {
          qf.style.height = Math.max(360, Math.min(2000, m.height)) + 'px';
        } else if (m.type === 'proposal-qa') {
          if (m.phase === 'start') track('qa_start');
          if (m.phase === 'end') track('qa_end');
        }
      });
    }

    var note = document.createElement('p');
    note.className = 'note';
    note.textContent = 'ご質問やご相談は support@01start.jp までお気軽にどうぞ。';
    card.appendChild(note);

    v.appendChild(card);
    v.hidden = false;
    track('page_open');
    startWatch();
  }

  function mkBtn(label, cls, fn) {
    var el = document.createElement('button');
    el.type = 'button';
    el.className = 'btn ' + cls;
    el.textContent = label;
    el.addEventListener('click', fn);
    return el;
  }

  // ── 視聴の計測 ──
  // 🚨 Bunny の再生状態はクロスオリジンで直接読めない。まず player.js を試し、
  //    応答が無ければ「プレーヤーがクリックされた + 画面が見えている秒数」で代替する。
  function startWatch() {
    var f = q('player');
    var gotPlayerJs = false;

    window.addEventListener('message', function (e) {
      if (!e.data) return;
      var m = e.data;
      if (typeof m === 'string') { try { m = JSON.parse(m); } catch (err) { return; } }
      if (m.context !== 'player.js') return;
      gotPlayerJs = true;
      if (m.event === 'play' && !playing) { playing = true; track('play'); }
      if (m.event === 'ended') { track('ended', { watchSeconds: watchSec }); }
      if (m.event === 'timeupdate' && m.value && m.value.seconds) {
        watchSec = Math.max(watchSec, Math.round(m.value.seconds));
      }
    });
    try {
      ['play', 'ended', 'timeupdate'].forEach(function (ev) {
        f.contentWindow.postMessage(JSON.stringify(
          { context: 'player.js', method: 'addEventListener', value: ev }), '*');
      });
    } catch (e) {}

    // クロスオリジン iframe のクリックは blur で検知できる
    window.addEventListener('blur', function () {
      if (playing) return;
      if (document.activeElement === f) { playing = true; track('play'); }
    });

    setInterval(function () {
      if (!playing || document.visibilityState !== 'visible') return;
      if (!gotPlayerJs) watchSec++;
      if (watchSec - sentSec >= 30) { sentSec = watchSec; track('progress', { watchSeconds: watchSec }); }
    }, 1000);

    var flush = function () {
      if (playing && watchSec > sentSec) { sentSec = watchSec; track('progress', { watchSeconds: watchSec }); }
    };
    window.addEventListener('pagehide', flush);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') flush();
    });
  }

  // トークンが無ければ入力させても意味がないので先に伝える
  if (!/^[a-f0-9]{32}$/.test(token)) {
    q('gateErr').textContent = 'URL が正しくありません。メールに記載のリンクからもう一度お開きください。';
    q('gateErr').hidden = false;
    q('gateBtn').disabled = true;
  }
})();
</script>
</body>
</html>
